version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: filequh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: filequh_user
      POSTGRES_PASSWORD: filequh_secret_password
      POSTGRES_DB: filequh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro

  minio:
    image: minio/minio:latest
    container_name: filequh-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
